---
layout: default
---
<div class="home">
  <div class="home-main">
    <img class="avatar" src="{{ "/assets/images/avatar.svg" | relative_url }}" alt="{{ site.title }}">
    <h1 class="name">{{ site.title }}</h1>
    <p class="signature">{{ site.signature }}</p>
    <section class="recent">
      <h2>最新文章</h2>
      <ul>
        {% for post in site.posts limit: 10 %}
        <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
        {% endfor %}
      </ul>
    </section>
    {{ content }}
  </div>
  <aside class="home-side">
    {% include social.html %}
  </aside>
</div>
