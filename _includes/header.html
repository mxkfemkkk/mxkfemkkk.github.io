{% assign current = page.url %}
<header class="site-header glass">
  <nav class="site-nav">
    <a class="brand {% if current == "/" %}active{% endif %}" href="{{ "/" | relative_url }}">{{ site.title }}</a>
    <a href="{{ "/posts/" | relative_url }}" class="{% if current contains "/posts/" or page.layout == "post" %}active{% endif %}">文章</a>
    <a href="{{ "/tags/" | relative_url }}" class="{% if current == "/tags/" %}active{% endif %}">标签</a>
    <a class="nav-about {% if current == "/about/" %}active{% endif %}" href="{{ "/about/" | relative_url }}">关于</a>
    <div class="nav-switches">
      <div class="glass-switch" role="group" aria-label="视觉风格">
        <button type="button" data-style="liquid" class="active" aria-pressed="true">液态</button>
        <button type="button" data-style="frost" aria-pressed="false">模糊</button>
        <button type="button" data-style="solid" aria-pressed="false">纯色</button>
      </div>
      <div class="theme-switch" role="group" aria-label="颜色主题">
        <button type="button" data-theme="light" aria-pressed="false">浅色</button>
        <button type="button" data-theme="dark" aria-pressed="false">深色</button>
        <button type="button" data-theme="auto" class="active" aria-pressed="true">自动</button>
      </div>
    </div>
  </nav>
</header>
